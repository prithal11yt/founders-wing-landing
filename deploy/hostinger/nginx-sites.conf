# Both sites on the Hostinger VPS. Installed as /etc/nginx/sites-available/fw-sites.
# The *.srv1006166.hstgr.cloud test names already resolve to this server, so the
# sites can be checked over HTTPS before the real domains move. certbot adds a
# 443 listener to each block once it has issued that block's certificate.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name fw.srv1006166.hstgr.cloud;
    include snippets/fw-proxy.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name tse.srv1006166.hstgr.cloud;
    include snippets/tse-proxy.conf;
}

# Real domains: answer as soon as DNS points here; certbot adds HTTPS after.
server {
    listen 80;
    listen [::]:80;
    server_name founderswing.com www.founderswing.com;
    include snippets/fw-proxy.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name thesoloentrepreneur.in www.thesoloentrepreneur.in;
    include snippets/tse-proxy.conf;
}
